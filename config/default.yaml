# Claude Router Configuration

# Server configuration
server:
  host: "127.0.0.1"
  port: 3000

# OpenRouter configuration
openrouter:
  api_key: "YOUR_OPENROUTER_API_KEY"
  base_url: "https://openrouter.ai/api/v1"

# Model roles configuration
roles:
  planner:
    model: "deepseek/deepseek-r1"
    description: "Used for architectural planning and high-level design"

  coder:
    model: "qwen/qwen3-coder"
    description: "Used for code implementation and editing"

  reviewer:
    model: "openai/gpt-5"
    description: "Used for code review and quality assurance"

  vision:
    model: "openai/gpt-5-vision"
    description: "Used for image analysis and visual tasks"

  fast:
    model: "meta-llama/llama-3.1-8b-instruct"
    description: "Used for fast responses with moderate quality"

  cheap:
    model: "mistralai/mistral-7b-instruct"
    description: "Used for cost-effective responses"

# Routing rules
routing:
  rules:
    - pattern: "architecture|design|plan"
      role: "planner"
      description: "Route architecture-related requests to the planner"

    - pattern: "implement|code|function|method"
      role: "coder"
      description: "Route implementation requests to the coder"

    - pattern: "review|check|audit"
      role: "reviewer"
      description: "Route review requests to the reviewer"

    - pattern: "\\.(png|jpg|jpeg|gif|webp)$"
      role: "vision"
      description: "Route image-related requests to the vision model"

    - pattern: "^(?!.*(?:architecture|design|plan|implement|code|function|method|review|check|audit)).{1,50}$"
      role: "fast"
      description: "Route short requests to the fast model"

    - pattern: "optimize|cost"
      role: "cheap"
      description: "Route cost-optimization requests to the cheap model"

# Default role when no rules match
default_role: "coder"

# Telemetry configuration
telemetry:
  enabled: true
  metrics_file: "metrics.json"
  log_level: "info"