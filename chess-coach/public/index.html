<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Coach</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">♞</span> Chess Coach</div>
  <nav id="nav">
    <button data-tab="games" class="on">Games</button>
    <button data-tab="review">Review</button>
    <button data-tab="train">Train</button>
    <button data-tab="lessons">Lessons</button>
    <button data-tab="profile">My weaknesses</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<main>
  <section id="tab-games"></section>
  <section id="tab-review" hidden></section>
  <section id="tab-train" hidden></section>
  <section id="tab-lessons" hidden></section>
  <section id="tab-profile" hidden></section>
</main>
<div id="toast" hidden></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
